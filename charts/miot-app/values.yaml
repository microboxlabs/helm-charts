# Default values for miot-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/microboxlabs/miot-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: app.modulariot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: app-tls
  #    hosts:
  #      - app.modulariot.local
  redirectRoot:
    enabled: false
    to: /app
    code: "308"

# APISIX Route — alternative to standard Ingress, uses ApisixRoute CRD
# Requires APISIX Ingress Controller with spec.ingressClassName support
apisixRoute:
  enabled: false
  ingressClassName: apisix
  hosts:
    - host: app.modulariot.local
      paths:
        - /
        - /*
  tls: []
  #  - hosts:
  #      - app.modulariot.local
  #    secretName: app-tls
  plugins: []
  # Example plugins:
  #   - name: redirect
  #     enable: true
  #     config:
  #       http_to_https: true
  #   - name: cors
  #     enable: true

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# Next.js health check paths
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Auth configuration (Next-Auth)
auth:
  # Secret for JWT signing (required for production)
  secret: ""
  # Use existing secret for auth credentials
  existingSecret: ""
  existingSecretKey: "auth-secret"
  # AUTH_PROVIDERS env var — controls which login buttons appear in the UI
  # Format: comma-separated provider IDs, * marks primary (highlighted button)
  # Examples: "microsoft-entra-id*,credentials", "google,github,saml*"
  authProviders: "microsoft-entra-id*,credentials"
  # Auth providers configuration
  providers:
    google:
      enabled: false
      clientId: ""
      clientSecret: ""
    auth0:
      enabled: false
      clientId: ""      # AUTH_AUTH0_ID
      clientSecret: ""  # AUTH_AUTH0_SECRET
      issuer: ""        # AUTH_AUTH0_ISSUER (e.g. https://auth0.microboxlabs.com)
      audience: ""      # AUTH_AUTH0_AUDIENCE (e.g. https://users.microboxlabs.com/v1)
      # Use an existing secret for Auth0 credentials instead of chart-managed values
      existingSecret: ""
      existingSecretClientIdKey: "auth0-client-id"
      existingSecretClientSecretKey: "auth0-client-secret"

# Additional environment variables
env: []
  # - name: NODE_ENV
  #   value: "production"
  # - name: NEXT_TELEMETRY_DISABLED
  #   value: "1"
  # - name: NEXTAUTH_URL
  #   value: "https://app.modulariot.com"

# Environment variables from secrets/configmaps
envFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-configmap

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
