---
suite: test auth0 secret
templates:
  - secret.yaml
tests:
  - it: should not render secret when auth0 is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret with auth0 credentials when enabled
    set:
      auth.providers.auth0.enabled: true
      auth.providers.auth0.clientId: "test-client-id"
      auth.providers.auth0.clientSecret: "test-client-secret"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.auth0-client-id
          value: "dGVzdC1jbGllbnQtaWQ="
      - equal:
          path: data.auth0-client-secret
          value: "dGVzdC1jbGllbnQtc2VjcmV0"

  - it: should render secret with both auth secret and auth0 credentials
    set:
      auth.secret: "my-jwt-secret"
      auth.providers.auth0.enabled: true
      auth.providers.auth0.clientId: "test-client-id"
      auth.providers.auth0.clientSecret: "test-client-secret"
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: data.auth-secret
      - exists:
          path: data.auth0-client-id
      - exists:
          path: data.auth0-client-secret

  - it: should not render auth0 entries when using existing secret
    set:
      auth.providers.auth0.existingSecret: "my-external-secret"
      auth.providers.auth0.issuer: "https://auth0.example.com"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render auth0 entries in chart secret when only google is enabled
    set:
      auth.providers.google.enabled: true
      auth.providers.google.clientId: "google-id"
      auth.providers.google.clientSecret: "google-secret"
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: data.google-client-id
      - exists:
          path: data.google-client-secret
      - notExists:
          path: data.auth0-client-id
      - notExists:
          path: data.auth0-client-secret
