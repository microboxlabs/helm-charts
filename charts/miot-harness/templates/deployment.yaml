apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "miot-harness.fullname" . }}
  labels:
    {{- include "miot-harness.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "miot-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "miot-harness.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "miot-harness.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.contextSkills.writable }}
      initContainers:
        - name: prepare-context-skills
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /workspace/context /workspace/skills
              {{- if .Values.contextSkills.seedDefaults }}
              defaults="$(python -c 'from pathlib import Path; import miot_harness; print(Path(miot_harness.__file__).parent / "context_skills" / "defaults")')"
              cp -Rn "${defaults}/context/." /workspace/context/
              cp -Rn "${defaults}/skills/." /workspace/skills/
              {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          {{- with .Values.contextSkills.initContainer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Full env construction lives in the "miot-harness.env" helper
          # (templates/_helpers.tpl): contract vars, optional knobs rendered
          # only when set, and credentials via secretKeyRef.
          env:
            {{- include "miot-harness.env" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # workspace: required because of readOnlyRootFilesystem=true.
            # Source switches between emptyDir and PVC via persistence.enabled.
            - name: workspace
              mountPath: /app/.miot-workspace
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.connectivity.tunnel.enabled }}
        # Tunnel sidecar — kubectl port-forward exposing Coordinador on
        # localhost:{{ .Values.connectivity.tunnel.port }}. Sidecar inherits
        # the container-level securityContext (UID 65534, read-only rootfs);
        # if the chosen image doesn't tolerate that, override via values.
        - name: tunnel
          image: {{ .Values.connectivity.tunnel.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.connectivity.tunnel.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.connectivity.tunnel.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: tunnel
              containerPort: {{ .Values.connectivity.tunnel.port }}
              protocol: TCP
          # MANDATORY: sidecar readinessProbe. App container's liveness
          # MUST NOT depend on this — they're decoupled by design (plan 13
          # 05-observability-and-health.md).
          readinessProbe:
            {{- toYaml .Values.connectivity.tunnel.readinessProbe | nindent 12 }}
          {{- if .Values.connectivity.tunnel.kubeconfigSecret }}
          env:
            - name: KUBECONFIG
              value: /etc/kube/config
          volumeMounts:
            - name: tunnel-kubeconfig
              mountPath: /etc/kube
              readOnly: true
          {{- end }}
          {{- with .Values.connectivity.tunnel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- $tunnelVol := and .Values.connectivity.tunnel.enabled .Values.connectivity.tunnel.kubeconfigSecret }}
      volumes:
        # workspace: PVC if persistence.enabled, else emptyDir. Always present.
        - name: workspace
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "miot-harness.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $tunnelVol }}
        - name: tunnel-kubeconfig
          secret:
            secretName: {{ .Values.connectivity.tunnel.kubeconfigSecret }}
            items:
              - key: {{ .Values.connectivity.tunnel.kubeconfigSecretKey | default "kubeconfig" }}
                path: config
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
