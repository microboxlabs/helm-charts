apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "miot-harness.fullname" . }}
  labels:
    {{- include "miot-harness.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "miot-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "miot-harness.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "miot-harness.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.contextSkills.writable }}
      initContainers:
        - name: prepare-context-skills
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /workspace/context /workspace/skills
              {{- if .Values.contextSkills.seedDefaults }}
              defaults="$(python -c 'from pathlib import Path; import miot_harness; print(Path(miot_harness.__file__).parent / "context_skills" / "defaults")')"
              cp -Rn "${defaults}/context/." /workspace/context/
              cp -Rn "${defaults}/skills/." /workspace/skills/
              {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          {{- with .Values.contextSkills.initContainer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Full env construction lives in the "miot-harness.env" helper
          # (templates/_helpers.tpl): contract vars, optional knobs rendered
          # only when set, and credentials via secretKeyRef.
          env:
            {{- include "miot-harness.env" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # workspace: required because of readOnlyRootFilesystem=true.
            # Source switches between emptyDir and PVC via persistence.enabled.
            - name: workspace
              mountPath: /app/.miot-workspace
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.observability.collector.enabled }}
        - name: otel-collector
          image: "{{ .Values.observability.collector.image.repository }}:{{ .Values.observability.collector.image.tag }}"
          imagePullPolicy: {{ .Values.observability.collector.image.pullPolicy }}
          args:
            - --config=/etc/otelcol/collector.yaml
          env:
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  {{- $lf := .Values.observability.langfuse }}
                  {{- include "miot-harness.credentialRef" (list . (dict "existingSecret" $lf.existingSecret "existingSecretKey" $lf.existingSecretKeys.publicKey) "public-key" "langfuse-public-key") | nindent 18 }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  {{- $lf := .Values.observability.langfuse }}
                  {{- include "miot-harness.credentialRef" (list . (dict "existingSecret" $lf.existingSecret "existingSecretKey" $lf.existingSecretKeys.secretKey) "secret-key" "langfuse-secret-key") | nindent 18 }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otel-health
              containerPort: 13133
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: otel-health
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: otel-health
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol
              readOnly: true
          {{- with .Values.observability.collector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- $root := . }}
        {{- range $t := include "miot-harness.tunnels" . | fromYamlArray }}
        # Connectivity sidecar {{ $t.name }} — makes a remote endpoint reachable
        # from the app container, which holds a plain DSN and does not know a
        # sidecar exists. Inherits the container-level securityContext (UID
        # 65534, read-only rootfs) unless the entry overrides it — a tunnel that
        # manages an interface needs to.
        - name: {{ $t.name }}
          image: {{ $t.image | quote }}
          imagePullPolicy: {{ $t.imagePullPolicy | default $root.Values.image.pullPolicy }}
          {{- with (default $root.Values.securityContext $t.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $t.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $t.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $t.port }}
          ports:
            - name: {{ $t.name | trunc 15 | trimSuffix "-" }}
              containerPort: {{ $t.port }}
              protocol: TCP
          {{- end }}
          # MANDATORY: sidecar readinessProbe. App container's liveness
          # MUST NOT depend on this — they're decoupled by design (plan 13
          # 05-observability-and-health.md).
          readinessProbe:
            {{- toYaml $t.readinessProbe | nindent 12 }}
          {{- if or $t.kubeconfigSecret $t.env }}
          env:
            {{- if $t.kubeconfigSecret }}
            - name: KUBECONFIG
              value: /etc/kube/config
            {{- end }}
            {{- with $t.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $t.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $t.kubeconfigSecret $t.volumeMounts }}
          volumeMounts:
            {{- if $t.kubeconfigSecret }}
            - name: {{ $t.name }}-kubeconfig
              mountPath: /etc/kube
              readOnly: true
            {{- end }}
            {{- with $t.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $t.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        # workspace: PVC if persistence.enabled, else emptyDir. Always present.
        - name: workspace
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "miot-harness.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- range $t := include "miot-harness.tunnels" . | fromYamlArray }}
        {{- if $t.kubeconfigSecret }}
        - name: {{ $t.name }}-kubeconfig
          secret:
            secretName: {{ $t.kubeconfigSecret }}
            items:
              - key: {{ $t.kubeconfigSecretKey | default "kubeconfig" }}
                path: config
        {{- end }}
        {{- end }}
        {{- if .Values.observability.collector.enabled }}
        - name: otel-collector-config
          configMap:
            name: {{ include "miot-harness.fullname" . }}-otel-collector
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
