apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "miot-harness.fullname" . }}
  labels:
    {{- include "miot-harness.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "miot-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "miot-harness.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "miot-harness.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Process / runtime
            - name: MIOT_HARNESS_ENV
              value: {{ .Values.env | quote }}
            - name: MIOT_HARNESS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MIOT_HARNESS_DEFAULT_TENANT_ID
              value: {{ .Values.defaultTenantId | quote }}
            - name: MIOT_HARNESS_DEFAULT_USER_ID
              value: {{ .Values.defaultUserId | quote }}
            - name: MIOT_HARNESS_REQUEST_ID_HEADER
              value: {{ .Values.requestIdHeader | quote }}
            # Nexo (Coordinador) DSN. Always projected via secretKeyRef so the
            # value never appears in `kubectl describe pod`. Helper picks the
            # right Secret: user-provided `existingSecret`, or the chart-managed
            # one rendered by templates/secret.yaml when `nexo.dsn` is a literal.
            {{- if or .Values.nexo.existingSecret .Values.nexo.dsn }}
            - name: MIOT_HARNESS_NEXO_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "miot-harness.nexoSecretName" . }}
                  key: {{ include "miot-harness.nexoSecretKey" . }}
            {{- end }}
            - name: MIOT_HARNESS_NEXO_DB_ALIAS
              value: {{ .Values.nexo.dbAlias | quote }}
            - name: MIOT_HARNESS_NEXO_APPLICATION_NAME
              value: {{ .Values.nexo.applicationName | quote }}
            - name: MIOT_HARNESS_NEXO_TENANT_LOCK
              value: {{ .Values.nexo.tenantLock | quote }}
            - name: MIOT_HARNESS_NEXO_SEARCH_PATH
              value: {{ .Values.nexo.searchPath | quote }}
            - name: MIOT_HARNESS_NEXO_FRESHNESS_WARN_MINUTES
              value: {{ .Values.nexo.freshnessWarnMinutes | quote }}
            - name: MIOT_HARNESS_NEXO_FRESHNESS_REFUSE_MINUTES
              value: {{ .Values.nexo.freshnessRefuseMinutes | quote }}
            - name: MIOT_HARNESS_NEXO_MAX_TURNS
              value: {{ .Values.nexo.maxTurns | quote }}
            - name: MIOT_HARNESS_NEXO_CRITIC_ENABLED
              value: {{ .Values.nexo.criticEnabled | quote }}
            - name: MIOT_HARNESS_NEXO_SUPERVISOR_MODE
              value: {{ .Values.nexo.supervisorMode | quote }}
            - name: MIOT_HARNESS_NEXO_FILTER_EXPERT_MODEL
              value: {{ .Values.nexo.models.filterExpert | quote }}
            - name: MIOT_HARNESS_NEXO_ANALYST_MODEL
              value: {{ .Values.nexo.models.analyst | quote }}
            - name: MIOT_HARNESS_NEXO_SYNTHESIZER_MODEL
              value: {{ .Values.nexo.models.synthesizer | quote }}
            - name: MIOT_HARNESS_NEXO_CRITIC_MODEL
              value: {{ .Values.nexo.models.critic | quote }}
            - name: MIOT_HARNESS_NEXO_SUMMARIZER_MODEL
              value: {{ .Values.nexo.models.summarizer | quote }}
            # Provider API keys. Same secretKeyRef pattern as MIOT_HARNESS_NEXO_DSN.
            # Env-var names are unprefixed because miot_harness/config.py reads them
            # via AliasChoices("ANTHROPIC_API_KEY", ...) / ("OPENAI_API_KEY", ...).
            {{- if or .Values.anthropic.existingSecret .Values.anthropic.apiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "miot-harness.anthropicSecretName" . }}
                  key: {{ include "miot-harness.anthropicSecretKey" . }}
            {{- end }}
            {{- if or .Values.openai.existingSecret .Values.openai.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "miot-harness.openaiSecretName" . }}
                  key: {{ include "miot-harness.openaiSecretKey" . }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # workspace: required because of readOnlyRootFilesystem=true.
            # Source switches between emptyDir and PVC via persistence.enabled.
            - name: workspace
              mountPath: /app/.miot-workspace
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.connectivity.tunnel.enabled }}
        # Tunnel sidecar — kubectl port-forward exposing Coordinador on
        # localhost:{{ .Values.connectivity.tunnel.port }}. Sidecar inherits
        # the container-level securityContext (UID 65534, read-only rootfs);
        # if the chosen image doesn't tolerate that, override via values.
        - name: tunnel
          image: {{ .Values.connectivity.tunnel.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.connectivity.tunnel.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.connectivity.tunnel.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: tunnel
              containerPort: {{ .Values.connectivity.tunnel.port }}
              protocol: TCP
          # MANDATORY: sidecar readinessProbe. App container's liveness
          # MUST NOT depend on this — they're decoupled by design (plan 13
          # 05-observability-and-health.md).
          readinessProbe:
            {{- toYaml .Values.connectivity.tunnel.readinessProbe | nindent 12 }}
          {{- if .Values.connectivity.tunnel.kubeconfigSecret }}
          env:
            - name: KUBECONFIG
              value: /etc/kube/config
          volumeMounts:
            - name: tunnel-kubeconfig
              mountPath: /etc/kube
              readOnly: true
          {{- end }}
          {{- with .Values.connectivity.tunnel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- $tunnelVol := and .Values.connectivity.tunnel.enabled .Values.connectivity.tunnel.kubeconfigSecret }}
      volumes:
        # workspace: PVC if persistence.enabled, else emptyDir. Always present.
        - name: workspace
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "miot-harness.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $tunnelVol }}
        - name: tunnel-kubeconfig
          secret:
            secretName: {{ .Values.connectivity.tunnel.kubeconfigSecret }}
            items:
              - key: {{ .Values.connectivity.tunnel.kubeconfigSecretKey | default "kubeconfig" }}
                path: config
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
