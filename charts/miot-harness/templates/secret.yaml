{{- if eq (include "miot-harness.shouldRenderCredentialsSecret" .) "true" }}
{{- $lf := .Values.observability.langfuse }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miot-harness.credentialsSecretName" . }}
  labels:
    {{- include "miot-harness.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (not .Values.datasource.existingSecret) .Values.datasource.dsn }}
  datasource-dsn: {{ .Values.datasource.dsn | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.anthropic.existingSecret) .Values.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.anthropic.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.openai.existingSecret) .Values.openai.apiKey }}
  openai-api-key: {{ .Values.openai.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.google.existingSecret) .Values.google.apiKey }}
  google-api-key: {{ .Values.google.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not $lf.existingSecret) $lf.publicKey }}
  langfuse-public-key: {{ $lf.publicKey | b64enc | quote }}
  {{- end }}
  {{- if and (not $lf.existingSecret) $lf.secretKey }}
  langfuse-secret-key: {{ $lf.secretKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.identity.existingSecret) .Values.identity.signingKey }}
  identity-signing-key: {{ .Values.identity.signingKey | b64enc | quote }}
  {{- end }}
{{- end }}
