{{- if eq (include "miot-harness.shouldRenderCredentialsSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miot-harness.credentialsSecretName" . }}
  labels:
    {{- include "miot-harness.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (not .Values.nexo.existingSecret) .Values.nexo.dsn }}
  nexo-dsn: {{ .Values.nexo.dsn | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.anthropic.existingSecret) .Values.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.anthropic.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.openai.existingSecret) .Values.openai.apiKey }}
  openai-api-key: {{ .Values.openai.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
