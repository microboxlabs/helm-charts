# Default values for miot-harness.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/microboxlabs/miot-harness
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

# Container-level security context. Matches the harness Dockerfile:
# the image runs as UID 65534 (`nobody`) on a read-only rootfs with only
# /app/.miot-workspace writable. Defaults below are safe for any
# pod-security policy ("restricted").
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # Matches Dockerfile EXPOSE 8000 (uvicorn default).
  port: 8000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Liveness probe MUST NOT depend on datasource state — the process is "live"
# as long as it serves /health (returns 200 even when the datasource is
# disabled). Readiness probe hits /health/ready, which the platform may
# consider not-ready when the datasource is required but not yet enabled.
# See plan 13 05-observability-and-health.md.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# =============================================================================
# Harness configuration — keys below map 1:1 to env vars read by
# `miot_harness/config.py` (core) and `integrations/nexo/settings.py`
# (provider-private). Aligned with the datasource-agnostic refactor
# (modulariot#604): MIOT_HARNESS_NEXO_* became DATASOURCE_* / AGENTS_*.
#
# Two conventions keep this surface slim:
#   * Keys with a concrete default are ALWAYS rendered as env vars.
#   * Keys defaulting to `null` are rendered ONLY when set — unset means
#     "use the harness built-in default" (stated in the trailing comment).
#     The chart never re-states application defaults, so it cannot drift
#     from them. Override only what differs in your environment.
#
# Secrets (DSN, API keys, Langfuse keys, identity signing key) are always
# projected via secretKeyRef — never as literal Pod env values.
# =============================================================================

# Process / runtime contract
env: "local"               # MIOT_HARNESS_ENV — set per environment.
defaultTenantId: "demo-tenant"
defaultUserId: "demo-user"
logLevel: "INFO"           # DEBUG | INFO | WARNING | ERROR | CRITICAL
requestIdHeader: "x-request-id"
# Comma-separated tenant ids allowed to request `debug=true` runs. Debug
# runs surface tool inputs/outputs over SSE — on a data-touching path that
# means real tenant data. Empty = debug denied for ALL tenants (secure
# default; keep empty in prod).
allowDebugTenants: ""      # MIOT_HARNESS_ALLOW_DEBUG_TENANTS

# Auth0 RS256 defense-in-depth on /runs* (#522 / modulariot #528).
# Off by default so unit tests and local dev keep the legacy
# unauthenticated surface. When enabled, the harness re-verifies the
# same RS256 token the Quarkus front door already validated. Field
# names mirror quarkus-srv's `auth.rs256*` block so a single set of
# Auth0 values renders both services. issuer/JWKS/audience are public —
# keep them as plain values, NOT a Secret. The harness lifespan fails
# fast (pod crashes at startup) if `enabled: true` with any field unset.
auth:
  enabled: false
  issuer: ""                 # AUTH0_ISSUER — exact `iss` claim to require.
  jwksUrl: ""                # AUTH0_JWKS_URL — Auth0 well-known JWKS.
  rs256Audience: ""          # AUTH0_RS256_AUDIENCE — required `aud` value.

# Datasource seam (modulariot#604). The harness core is datasource-agnostic;
# `kind` selects a DataSourceProvider from the registry (currently: `nexo`).
# Domain defaults — tenant lock, freshness gates — live in the provider's
# profile, NOT in this chart: leave the null keys below unset unless you
# need to OVERRIDE the profile.
#
# DSN options (in precedence order):
#   * `datasource.existingSecret` — reference a Secret holding the DSN
#                                   (production path)
#   * `datasource.dsn`            — literal DSN; chart stores it in a
#                                   chart-managed Secret (dev convenience)
#   * neither set                 — datasource disabled at boot; the harness
#                                   stays healthy and serves non-data runs.
datasource:
  kind: "nexo"                         # MIOT_HARNESS_DATASOURCE_KIND
  dsn: ""                              # NEVER commit a real DSN here.
  existingSecret: ""                   # Name of K8s Secret with the DSN.
  existingSecretKey: "dsn"             # Field within that Secret.
  applicationName: "miot-harness"      # Visible in pg_stat_activity.
  # Hard tenant lock for every datasource tool call. Must be non-empty if
  # set (the harness refuses to boot on ""). null → provider profile
  # default (nexo: "mintral").
  tenantLock: null                     # MIOT_HARNESS_DATASOURCE_TENANT_LOCK
  # Snapshot freshness gates, minutes. `refuse` is a hard gate that
  # disables the datasource when the snapshot is older. Explicit 0 is
  # honored. null → profile defaults (nexo: warn 30 / refuse 240).
  freshnessWarnMinutes: null           # MIOT_HARNESS_DATASOURCE_FRESHNESS_WARN_MINUTES
  freshnessRefuseMinutes: null         # MIOT_HARNESS_DATASOURCE_FRESHNESS_REFUSE_MINUTES

# Provider-private knobs for the built-in `nexo` datasource. These are
# Postgres concepts (schema search path, EXPLAIN plan cost) and keep the
# MIOT_HARNESS_NEXO_* prefix upstream. Ignored by other datasource kinds.
nexo:
  searchPath: null             # null → "nexo"    MIOT_HARNESS_NEXO_SEARCH_PATH
  explainCostThreshold: null   # null → 10000.0   MIOT_HARNESS_NEXO_EXPLAIN_COST_THRESHOLD

# Agent graph (MIOT_HARNESS_AGENTS_*). All null → harness built-in defaults.
agents:
  maxTurns: null               # null → 8
  criticEnabled: null          # null → false
  supervisorMode: null         # null → "rule" ("rule" | "llm")
  models:
    filterExpert: null         # null → "claude-haiku-4-5"
    analyst: null              # null → "claude-sonnet-4-6"
    synthesizer: null          # null → "claude-sonnet-4-6"
    critic: null               # null → "claude-sonnet-4-6"
    summarizer: null           # null → "claude-haiku-4-5"
  # Synthesizer SSE streaming with extended thinking. `false` is the
  # production kill switch (falls back to non-streaming .ainvoke()).
  synthesizerStream: null          # null → true
  # Extended-thinking token budget; 0 disables thinking entirely.
  synthesizerThinkingBudget: null  # null → 4096

# Intent router — runs on EVERY auto-mode request. Defaults to a claude-*
# model, so a missing ANTHROPIC_API_KEY 500s every auto request.
intentRouter:
  model: null                  # null → "claude-haiku-4-5"
  confidenceThreshold: null    # null → 0.7 (below it → keyword-router fallback)

# Conversation-memory hydration cap, in tokens.
conversationTokenBudget: null  # null → 24000

# Signed identity header (X-MIOT-Identity, HMAC-SHA256). When a signing key
# is present, tenant/user ids in request bodies are ignored in favor of the
# verified header values. Leave both key fields empty to disable (local/dev).
# Generate a strong random secret for production if the approvals/identity
# feature is in use — the harness refuses to boot on an empty string.
identity:
  signingKey: ""               # Literal value (chart creates a Secret).
  existingSecret: ""           # Reference a Secret instead (production).
  existingSecretKey: "signing-key"
  skewSeconds: null            # null → 60 (clock-skew tolerance for `exp`)

# Observability: OTel exporter + Langfuse tracing keys.
observability:
  otel:
    enabled: false             # MIOT_HARNESS_OTEL_ENABLED
    # Collector endpoint, e.g. http://otel-collector.observability:4317.
    # "" → not rendered (harness default: http://localhost:4317).
    endpoint: ""               # MIOT_HARNESS_OTEL_ENDPOINT
    serviceName: null          # null → "miot-harness"
    # "" → falls back to `env` above, so prod traces tag themselves "prod"
    # without a second knob.
    environment: ""            # MIOT_HARNESS_OTEL_ENVIRONMENT
  langfuse:
    # Langfuse base URL (used by tracing + the cost-report CLI).
    host: null                 # null → "http://localhost:3000"
    publicKey: ""              # pk-lf-… literal (chart creates a Secret).
    secretKey: ""              # sk-lf-… literal (chart creates a Secret).
    existingSecret: ""         # Secret holding BOTH keys (production).
    existingSecretKeys:
      publicKey: "public-key"
      secretKey: "secret-key"

# Provider API keys. Three modes per provider (in precedence order):
#   1. existingSecret non-empty     -> chart references the Secret.
#   2. apiKey non-empty             -> chart creates a Secret.
#   3. both empty                   -> env var unset, harness boots
#                                       without that provider.
# Anthropic is effectively REQUIRED: every default model and the intent
# router are claude-*. OpenAI / Google only matter if you point a *_MODEL
# at gpt-*/o-series or gemini-* models.
# Memory: never commit a real API key as a default.
anthropic:
  existingSecret: ""
  existingSecretKey: "api-key"
  apiKey: ""
openai:
  existingSecret: ""
  existingSecretKey: "api-key"
  apiKey: ""
google:
  existingSecret: ""
  existingSecretKey: "api-key"
  apiKey: ""

# Escape hatches: appended verbatim to the harness container. Use these for
# env vars the chart doesn't model yet (new harness knobs, provider-private
# settings of future datasource kinds, etc.).
extraEnv: []
# - name: MIOT_HARNESS_SOME_NEW_KNOB
#   value: "x"
extraEnvFrom: []
# - secretRef:
#     name: harness-extra-secrets

# Connectivity to Coordinador. The tunnel sidecar is a dev convenience
# (kubectl port-forward inside the Pod); production should reach
# Coordinador via VNet peering / Private Link / PostgREST instead.
#
# When `tunnel.enabled: true`, set `datasource.dsn` (or the existingSecret
# behind it) to point at `localhost:<tunnel.port>` — the harness reads
# the same DSN env var either way; it doesn't know there's a sidecar.
connectivity:
  tunnel:
    enabled: false
    image: bitnami/kubectl:1.30
    command:
      - sh
      - -c
    # Default args: port-forward loop that auto-restarts on disconnect.
    # Replace `coordinador/pgbouncer` and ports with your cluster's
    # service. The first port is the LOCAL port (matches `tunnel.port`
    # below); the second is the REMOTE service port.
    args:
      - |
        while true; do
          kubectl port-forward -n coordinador svc/pgbouncer 6434:6432 \
            --address 127.0.0.1 || true
          sleep 5
        done
    # Local port the sidecar exposes inside the Pod.
    port: 6434
    # Secret holding a kubeconfig granting port-forward rights on the
    # Coordinador cluster. Created out-of-band; chart only references it.
    # Empty = sidecar runs without a kubeconfig (relies on in-cluster
    # ServiceAccount, which only works if the harness's SA has the rights
    # — usually not the case across clusters).
    kubeconfigSecret: ""
    kubeconfigSecretKey: "kubeconfig"
    # Sidecar readinessProbe — MANDATORY. TCP socket on the local port;
    # the sidecar reports ready only when port-forward is established.
    readinessProbe:
      tcpSocket:
        port: 6434
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6
    resources: {}

# NetworkPolicy egress allowlist. Defaults off — many CNIs silently
# ignore NetworkPolicy; defaulting on would create false confidence.
# Standard NetworkPolicy is L3/L4 only (no FQDN); pair with a CNI policy
# (Cilium/Calico) if you need hostname-based egress restriction.
networkPolicy:
  enabled: false
  # DNS namespace — mandatory egress when the policy is enabled.
  # Override if your cluster runs CoreDNS elsewhere.
  dnsNamespace: kube-system
  # Public HTTPS egress (Anthropic, OpenAI, telemetry sinks).
  # Permits 0.0.0.0/0:443 EXCEPT RFC1918 — internal services stay locked.
  allowPublicHttps: true
  # Coordinador (PG / pgbouncer / PostgREST). MUST be set explicitly;
  # empty CIDR list = no Coordinador access (fail-closed).
  coordinador:
    cidrs: []                  # e.g. ["10.10.0.0/16"]
    ports:
      - port: 6432             # pgbouncer
        protocol: TCP
      - port: 5432             # direct PG fallback
        protocol: TCP
  # Free-form extra egress rules. Each entry is a full
  # NetworkPolicyEgressRule (`to`, `ports`).
  extraEgress: []
  # Ingress: default allow same-namespace Pods (Service traffic).
  ingress:
    enabled: true

# Observability. T09 adds the ServiceMonitor template.
# `/metrics` endpoint lands in plan 13 phase 5 (the harness side);
# the chart is forward-compatible — toggling on without the endpoint
# is a no-op surface for ops.
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    # release: prometheus

# Workspace persistence. The chart ALWAYS mounts a writable volume at
# `/app/.miot-workspace` (required because the container runs with
# readOnlyRootFilesystem=true). Default emptyDir survives container
# restarts but not pod rescheduling; opt-in PVC for run_store durability.
persistence:
  enabled: false
  # If set, chart skips PVC creation and references this claim directly.
  # Lets operators bring their own PVC (StatefulSet-style claim management,
  # cluster-shared storage, etc.).
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}
