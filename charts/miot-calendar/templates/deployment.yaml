apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "miot-calendar.fullname" . }}
  labels:
    {{- include "miot-calendar.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "miot-calendar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "miot-calendar.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "miot-calendar.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Database configuration
            {{- if .Values.postgresql.external.enabled }}
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ include "miot-calendar.databaseUrl" . | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              {{- if .Values.postgresql.external.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.existingSecretUsernameKey }}
              {{- else }}
              value: {{ .Values.postgresql.external.username | quote }}
              {{- end }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "miot-calendar.databaseSecretName" . }}
                  key: {{ .Values.postgresql.external.existingSecretPasswordKey | default "password" }}
            {{- end }}
            # Flyway and Hibernate schema configuration
            {{- if .Values.postgresql.external.schema }}
            - name: QUARKUS_FLYWAY_SCHEMAS
              value: {{ include "miot-calendar.databaseSchema" . | quote }}
            - name: QUARKUS_FLYWAY_DEFAULT_SCHEMA
              value: {{ include "miot-calendar.databaseSchema" . | quote }}
            - name: QUARKUS_HIBERNATE_ORM_DATABASE_DEFAULT_SCHEMA
              value: {{ include "miot-calendar.databaseSchema" . | quote }}
            {{- end }}
            # Additional environment variables
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
