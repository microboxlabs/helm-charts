# Default values for ModularIoT umbrella chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global values that apply to all sub-charts
global:
  # Image pull secrets shared across all apps
  imagePullSecrets: []
  # Common labels applied to all resources
  labels: {}

# ModularIoT Documentation
miot-docs:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/microboxlabs/miot-docs
    tag: ""
  ingress:
    enabled: false
    hosts:
      - host: docs.modulariot.local
        paths:
          - path: /
            pathType: Prefix

# ModularIoT Website
miot-web-site:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/microboxlabs/miot-web-site
    tag: ""
  ingress:
    enabled: false
    hosts:
      - host: www.modulariot.local
        paths:
          - path: /
            pathType: Prefix

# ModularIoT Main App
miot-app:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/microboxlabs/miot-app
    tag: ""
  ingress:
    enabled: false
    hosts:
      - host: app.modulariot.local
        paths:
          - path: /
            pathType: Prefix
  auth:
    secret: ""
    existingSecret: ""
    providers:
      google:
        enabled: false

# ModularIoT Quarkus Modulith
miot-modulith:
  enabled: true
  image:
    repository: ghcr.io/microboxlabs/miot-srv
    tag: "latest"
  components:
    fleet:
      enabled: true
    driver:
      enabled: false
  ingress:
    enabled: false
    hosts:
      - host: api.modulariot.local
        paths:
          - path: /
            pathType: Prefix
  oidc:
    authServerUrl: "http://keycloak/realms/miot"
    clientId: "miot-backend"

# ModularIoT Harness — multi-agent backend (FastAPI). Default disabled
# so existing umbrella users don't suddenly get an agent runtime they
# didn't ask for. Enable with `--set miot-harness.enabled=true`.
# Since chart 0.3.0 the config surface follows the datasource-agnostic
# refactor (modulariot#604): `datasource.*` / `agents.*` instead of the
# old `nexo.*` block. The subchart only renders env vars you set, so a
# minimal enablement needs just the secrets:
#
# miot-harness:
#   enabled: true
#   env: "prod"
#   datasource:
#     existingSecret: "harness-datasource"   # key: dsn
#   anthropic:
#     existingSecret: "harness-anthropic"    # key: api-key
#
# Full parameters: https://microboxlabs.github.io/helm-charts/en/charts/modulariot/miot-harness
miot-harness:
  enabled: false

# MIOT dashboard server — persistence, identity and tenancy for embeddable
# dashboards. Default disabled: it is a stateful component (a volume holding
# every tenant's dashboards) and it refuses to start without an identity
# provider, so it has to be configured before it is turned on.
#
# miot-dashboard-server:
#   enabled: true
#   auth:
#     jwt:
#       issuer: https://issuer.example/
#       audience: <the audience your tokens carry>
#       jwksUrl: https://issuer.example/.well-known/jwks.json
#   tenants:
#     url: https://host.example/people/{userId}/tenants/{tenantId}
#   scopes:
#     url: https://host.example/people/{userId}/scopes/{scopeId}
#
# Both authority URLs must be https — the answer decides who gets in, so it
# cannot travel where it could be forged.
miot-dashboard-server:
  enabled: false

# Langfuse development observability stack. This deploys stateful PostgreSQL,
# Valkey, MinIO, and ClickHouse dependencies, so it remains opt-in.
miot-observability:
  enabled: false
  langfuse:
    enabled: false
