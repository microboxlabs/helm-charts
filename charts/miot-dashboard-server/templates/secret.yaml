{{- if eq (include "miot-dashboard-server.shouldRenderCredentialsSecret" .) "true" }}
{{- $jwt := .Values.auth.jwt }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miot-dashboard-server.credentialsSecretName" . }}
  labels:
    {{- include "miot-dashboard-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (not $jwt.publicKey.existingSecret) $jwt.publicKey.value }}
  jwt-public-key: {{ $jwt.publicKey.value | b64enc | quote }}
  {{- end }}
  {{- if and (not $jwt.secret.existingSecret) $jwt.secret.value }}
  jwt-secret: {{ $jwt.secret.value | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.store.postgres.existingSecret) .Values.store.postgres.url }}
  postgres-url: {{ .Values.store.postgres.url | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.tenants.existingSecret) .Values.tenants.serviceValue }}
  tenants-service-value: {{ .Values.tenants.serviceValue | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.scopes.existingSecret) .Values.scopes.serviceValue }}
  scopes-service-value: {{ .Values.scopes.serviceValue | b64enc | quote }}
  {{- end }}
{{- end }}
