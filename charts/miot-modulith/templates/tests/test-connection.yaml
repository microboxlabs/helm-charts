apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "miot-modulith.fullname" . }}-test-connection"
  labels:
    {{- include "miot-modulith.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['--spider', '-q', '{{ include "miot-modulith.fullname" . }}:{{ .Values.service.port }}/q/health/ready']
  restartPolicy: Never
