apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "miot-modulith.fullname" . }}
  labels:
    {{- include "miot-modulith.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "miot-modulith.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "miot-modulith.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "miot-modulith.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Database — JDBC datasource (Flyway migrations)
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ include "miot-modulith.databaseJdbcUrl" . | quote }}
            # Database — reactive datasource (Hibernate Reactive Panache)
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: {{ include "miot-modulith.databaseReactiveUrl" . | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              {{- if .Values.postgresql.external.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.existingSecretUsernameKey }}
              {{- else }}
              value: {{ .Values.postgresql.external.username | quote }}
              {{- end }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "miot-modulith.databaseSecretName" . }}
                  key: {{ .Values.postgresql.external.existingSecretPasswordKey | default "password" }}
            # Flyway
            - name: QUARKUS_FLYWAY_MIGRATE_AT_START
              value: {{ .Values.flyway.migrateAtStart | quote }}
            {{- if .Values.oidc.authServerUrl }}
            # OIDC / Keycloak (DEPRECATED — kept for backwards compat)
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: {{ .Values.oidc.authServerUrl | quote }}
            - name: QUARKUS_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: QUARKUS_OIDC_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "miot-modulith.oidcSecretName" . }}
                  key: {{ .Values.oidc.existingSecretKey | default "client-secret" }}
            {{- end }}
            # Auth0 dual JWT (DualJwtAuthMechanism)
            {{- if .Values.auth.issuer }}
            - name: AUTH0_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            {{- end }}
            {{- if or .Values.auth.hs256Secret .Values.auth.existingSecret }}
            - name: AUTH0_HS256_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "miot-modulith.authSecretName" . }}
                  key: {{ .Values.auth.existingSecretHs256Key | default "hs256-secret" }}
            {{- end }}
            {{- if .Values.auth.jwksUrl }}
            - name: AUTH0_JWKS_URL
              value: {{ .Values.auth.jwksUrl | quote }}
            {{- end }}
            {{- if .Values.auth.hs256Audience }}
            - name: AUTH0_HS256_AUDIENCE
              value: {{ .Values.auth.hs256Audience | quote }}
            {{- end }}
            {{- if .Values.auth.rs256Audience }}
            - name: AUTH0_RS256_AUDIENCE
              value: {{ .Values.auth.rs256Audience | quote }}
            {{- end }}
            # Messaging
            - name: MIOT_MESSAGING_TYPE
              value: {{ .Values.messaging.type | quote }}
            {{- if .Values.messaging.pulsarUrl }}
            - name: PULSAR_URL
              value: {{ .Values.messaging.pulsarUrl | quote }}
            {{- end }}
            {{- if .Values.messaging.trackingTopic }}
            - name: MIOT_TRACKING_TOPIC
              value: {{ .Values.messaging.trackingTopic | quote }}
            {{- end }}
            # Modulith component selection
            - name: MIOT_COMPONENT_FLEET_ENABLED
              value: {{ .Values.components.fleet.enabled | quote }}
            - name: MIOT_COMPONENT_DRIVER_ENABLED
              value: {{ .Values.components.driver.enabled | quote }}
            - name: MIOT_COMPONENT_TRACKING_ENABLED
              value: {{ .Values.components.tracking.enabled | quote }}
            - name: MIOT_COMPONENT_GATEWAY_ENABLED
              value: {{ .Values.components.gateway.enabled | quote }}
            {{- if .Values.fork.enabled }}
            # Fork engine
            - name: FORK_ENABLED
              value: "true"
            {{- range $i, $rule := .Values.fork.rules }}
            - name: FORK_RULES_{{ $i }}__ID
              value: {{ $rule.id | quote }}
            - name: FORK_RULES_{{ $i }}__ENABLED
              value: {{ $rule.enabled | default true | quote }}
            {{- range $j, $path := $rule.paths }}
            - name: FORK_RULES_{{ $i }}__PATHS_{{ $j }}_
              value: {{ $path | quote }}
            {{- end }}
            - name: FORK_RULES_{{ $i }}__BODY_PARSER
              value: {{ $rule.bodyParser | default "json" | quote }}
            - name: FORK_RULES_{{ $i }}__KEY_FIELD
              value: {{ $rule.keyField | default "asset_id" | quote }}
            {{- if $rule.filterFile }}
            - name: FORK_RULES_{{ $i }}__FILTER_FILE
              value: {{ $rule.filterFile | quote }}
            {{- end }}
            {{- range $k, $target := $rule.targets }}
            - name: FORK_RULES_{{ $i }}__TARGETS_{{ $k }}__ID
              value: {{ $target.id | quote }}
            - name: FORK_RULES_{{ $i }}__TARGETS_{{ $k }}__MIRROR_HOST
              value: {{ $target.mirrorHost | quote }}
            - name: FORK_RULES_{{ $i }}__TARGETS_{{ $k }}__MIRROR_PATH
              value: {{ $target.mirrorPath | default "/" | quote }}
            - name: FORK_RULES_{{ $i }}__TARGETS_{{ $k }}__TIMEOUT
              value: {{ $target.timeout | default 5000 | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            # Additional environment variables
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.volumeMounts .Values.fork.filters }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.fork.filters }}
            - name: fork-filters
              mountPath: /config/fork
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.fork.filters }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.fork.filters }}
        - name: fork-filters
          configMap:
            name: {{ include "miot-modulith.fullname" . }}-fork-filters
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
