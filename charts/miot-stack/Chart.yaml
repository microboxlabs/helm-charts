apiVersion: v2
name: miot-stack
description: Umbrella Helm chart for the ModularIoT app, docs, and Quarkus modulith
type: application
version: 0.2.1
appVersion: "1.0.0"
keywords:
  - modulariot
  - iot
  - platform
  - umbrella
home: https://github.com/microboxlabs/modulariot
sources:
  - https://github.com/microboxlabs/modulariot
maintainers:
  - name: MicroboxLabs
    email: dev@microboxlabs.com
    url: https://microboxlabs.com

dependencies:
  - name: miot-docs
    version: "0.1.1"
    repository: "file://../miot-docs"
    condition: miot-docs.enabled
  - name: miot-app
    version: "0.3.3"
    repository: "file://../miot-app"
    condition: miot-app.enabled
  - name: miot-modulith
    version: "0.5.0"
    repository: "file://../miot-modulith"
    condition: miot-modulith.enabled
